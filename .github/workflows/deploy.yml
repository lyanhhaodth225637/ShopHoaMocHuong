name: Deploy Website via FTP

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code mới nhất từ GitHub
        uses: actions/checkout@v4

      - name: Đồng bộ code lên cPanel qua FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          
          # Đẩy thẳng vào thư mục hiện tại của tài khoản FTP (chính là public_html/mochuong)
          server-dir: ./ 
          
          # Loại trừ các file không cần thiết đưa lên web
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
